<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        $(function () {
            $("#formularz").submit(function (e) {
                e.preventDefault()
                let nazwa = $("#nazwa").val().trim()
                let ilosc = $("#ilosc").val()



                if (!(nazwa == "" || ilosc <= 0)) {
                    let wierszlisty = $("<li>" + nazwa + " - " + ilosc + "szt.</li>")
                    let guzik = $("<button>Usuń</button>")
                    guzik.click(function () {
                        wierszlisty.remove()
                        $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)

                        if($("li").length == 0){
                    $("#pusta").text("lista pusta")
                }
                    })
                    wierszlisty.append(guzik)
                    $("#lista").append(wierszlisty)
                    $("#pusta").text("")
                    $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)
                    $("#blad").text("")
                    $("#alert").removeClass("alert alert-warning")

                    wierszlisty.click(function () {
                        wierszlisty.toggleClass("przekresl")
                        $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)
                    })
                } else {
                    $("#blad").text("proszę podac nazwę i ilość wiekszą od 0").css("color", "red")
                    $("#alert").addClass("alert alert-warning")
                }

                $("#usun").click(function(){
                    $(".przekresl").remove()
                    $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)

                
                })
            

            })



        });
    </script>
    <style>
        .przekresl {
            color: gray;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <h1>Lista Zakupów</h1>
    <form id="formularz">
        <input type="text" id="nazwa" placeholder="Wpisz nazwę">

        <input type="number" id="ilosc" placeholder="ilosc">

        <button type="submit">Dodaj</button>


    </form>
    <div id="alert" role="alert">
            <p id="blad"></p>
    </div>

    <p id="licznik">do kupienia: 0, kupione: 0</p>
    <button id="usun">usun kupione</button>
    <p id="pusta">lista pusta</p>
    <ul id="lista"></ul>
</body>

</html>
