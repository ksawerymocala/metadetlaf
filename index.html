<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        $(function () {
            $("#formularz").submit(function (e) {
                e.preventDefault()
                let nazwa = $("#nazwa").val().trim()
                let ilosc = $("#ilosc").val()



                if (!(nazwa == "" || ilosc <= 0)) {
                    let wierszlisty = $("<li class='list-group-item'>" + nazwa + " - " + ilosc + "szt.</li>")
                    let guzik = $("<button class='btn btn-outline-danger usun'>Usuń</button>")
                    guzik.click(function () {
                        wierszlisty.remove()
                        $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)

                        if ($("li").length == 0) {
                            $("#pusta").text("lista pusta")
                        }
                    })
                    wierszlisty.append(guzik)
                    $("#lista").append(wierszlisty)
                    $("#pusta").text("")
                    $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)
                    $("#blad").text("")
                    $("#alert").removeClass("alert alert-warning")

                    wierszlisty.click(function () {
                        wierszlisty.toggleClass("przekresl")
                        $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)
                    })
                } else {
                    $("#blad").text("proszę podac nazwę i ilość wiekszą od 0").css("color", "red")
                    $("#alert").addClass("alert alert-warning")
                }

                $("#usun").click(function () {
                    $(".przekresl").remove()
                    $("#licznik").text("do kupienia: " + ($("li").length - $(".przekresl").length) + ", kupione: " + $(".przekresl").length)


                })
                


            })
            


        });
    </script>
    <style>
        body{
            background-color: rgb(210, 223, 243);
        }
        .przekresl {
            color: gray;
            text-decoration: line-through;
        }

        .heder {
            background-color: rgb(14, 48, 122);
            border-radius: 7px;
        }

        .tlo{
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            border: 1px solid rgb(175, 196, 202);
        }
        .ostatnizlisty{
            margin-bottom: 50px;
        }
        .usun{
            float: right;
        }

    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row text-light p-3 m-3 heder">
            <h1>Lista Zakupów</h1>
        </div>

        <div class="row">
            <div class="col-5 ">
                <div class="row m-3 tlo">

                    <p id="licznik" class="mt-2 text-center">do kupienia: 0, kupione: 0</p>
                    <button class="btn btn-danger w-50 mx-auto mb-3" id="usun">Usuń kupione</button>
                </div>
                <div class="row m-3 tlo">
                    <form id="formularz">
                        <input class="m-2" type="text" id="nazwa" placeholder="Nazwa produktu">

                        <input class="m-2" type="number" id="ilosc" placeholder="Ilosc">

                        <button class="btn btn-primary m-2" type="submit">Dodaj</button>

                        <div id="alert" role="alert">
                            <p id="blad"></p>
                        </div>


                    </form>
                </div>
            </div>
            <div class="col-6 m-3 tlo">
                
                <h3 id="pusta" class="text-center">Lista jest pusta</h3>
                <ul class="list-group pb-3" id="lista"></ul>
            </div>
        </div>








    </div>
</body>

</html>
